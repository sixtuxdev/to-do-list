<ion-header class="ion-no-border app-gradient-header">
  <ion-toolbar color="transparent">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Categorías</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openCategoryDialog()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="categories-container" *ngIf="(categories$ | async)?.length! > 0">
    <ion-item-sliding *ngFor="let category of categories$ | async; trackBy: trackByFn" #slidingItem class="premium-sliding-item">
      
      <ion-item [button]="true" (click)="openCategoryDialog(category)" class="category-item premium-card" lines="none">
        <div slot="start" class="category-icon-container" [style.--cat-color]="category.color">
          <ion-icon [name]="category.icon"></ion-icon>
        </div>
        <ion-label>
          <h2 class="category-name">{{ category.name }}</h2>
        </ion-label>
        <ion-icon slot="end" name="create-outline" class="edit-icon"></ion-icon>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" class="delete-option" (click)="confirmDelete(category.id, slidingItem)">
          <div class="option-content">
            <ion-icon name="trash-outline"></ion-icon>
            <span>Eliminar</span>
          </div>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </div>

  <div class="empty-state fade-in" *ngIf="(categories$ | async)?.length === 0">
    <div class="empty-icon-container">
      <ion-icon name="folder-open-outline"></ion-icon>
    </div>
    <h3>Sin Categorías</h3>
    <p>Crea tu primera categoría para organizar mejor tus tareas.</p>
    <ion-button shape="round" class="create-btn" (click)="openCategoryDialog()">
      <ion-icon slot="start" name="add-outline"></ion-icon>
      Crear Categoría
    </ion-button>
  </div>

</ion-content>
