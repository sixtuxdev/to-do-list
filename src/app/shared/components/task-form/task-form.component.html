<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <ion-title class="modal-title">{{ task ? 'Editar Tarea' : 'Nueva Tarea' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" class="close-btn">
        <ion-icon slot="icon-only" name="close-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="premium-form">
    
    <div class="form-group">
      <ion-item class="premium-input-item" lines="none">
        <ion-input formControlName="title" placeholder="¿Qué necesitas hacer?" clearInput></ion-input>
      </ion-item>
      <ion-note color="danger" class="error-msg" *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched">
        El título es obligatorio.
      </ion-note>
    </div>

    <div class="form-group">
      <ion-item class="premium-input-item" lines="none">
        <ion-textarea formControlName="description" placeholder="Añade detalles o notas..." autoGrow rows="3"></ion-textarea>
      </ion-item>
    </div>

    <div class="form-row">
      <div class="form-group half-width">
        <label class="input-label">Prioridad</label>
        <ion-item class="premium-select-item" lines="none">
          <ion-icon name="flag-outline" slot="start" [color]="taskForm.get('priority')?.value === 'high' ? 'danger' : taskForm.get('priority')?.value === 'medium' ? 'warning' : 'success'"></ion-icon>
          <ion-select formControlName="priority" interface="popover">
            <ion-select-option value="low">Baja</ion-select-option>
            <ion-select-option value="medium">Media</ion-select-option>
            <ion-select-option value="high">Alta</ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <div class="form-group half-width">
        <label class="input-label">Fecha Límite</label>
        <div class="premium-date-trigger" id="date-picker-trigger">
          <ion-icon name="calendar-outline" color="primary"></ion-icon>
          <span class="date-text" [class.has-value]="taskForm.get('dueDate')?.value">
            {{ taskForm.get('dueDate')?.value ? (taskForm.get('dueDate')?.value | date:'MMM d') : 'Sin fecha' }}
          </span>
          <ion-icon name="close-circle" class="clear-date" *ngIf="taskForm.get('dueDate')?.value" (click)="clearDate($event)"></ion-icon>
        </div>

        <ion-modal trigger="date-picker-trigger" class="datetime-modal premium-datetime-modal">
          <ng-template>
            <ion-datetime 
              presentation="date" 
              [value]="taskForm.get('dueDate')?.value"
              (ionChange)="onDateChange($event)"
              [showDefaultButtons]="true" 
              doneText="Aceptar" 
              cancelText="Cancelar">
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </div>
    </div>

    <div class="form-group" *ngIf="enableCategories$ | async">
      <label class="input-label">Categoría</label>
      <app-category-selector formControlName="categoryId"></app-category-selector>
    </div>

    <div class="action-buttons">
      <ion-button expand="block" shape="round" type="submit" class="submit-btn" [disabled]="taskForm.invalid">
        {{ task ? 'Actualizar' : 'Guardar' }} Tarea
      </ion-button>
    </div>
  </form>
</ion-content>
